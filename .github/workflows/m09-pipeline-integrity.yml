name: M09 Pipeline Integrity

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - chatgpt/arena-m09cd-rebuild

permissions:
  contents: read

jobs:
  linux-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Diff hygiene
        run: git diff --check
