name: Windows Build (ephemeral)

on:
  push:
    branches:
      - 'ci/windows-build-*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust info
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          rustup target list --installed
          node --version
          npm --version

      - name: Install frontend deps
        shell: pwsh
        run: npm install

      - name: Frontend build
        shell: pwsh
        run: npm run build

      - name: Show dist
        shell: pwsh
        run: |
          Get-ChildItem -Recurse dist | Format-Table
          Get-ChildItem -Recurse dist | Measure-Object -Property Length -Sum | Format-List

      - name: Cargo check (linux target not needed, just windows)
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows (NSIS + MSI)
        shell: pwsh
        run: npm run tauri build
        # Produces src-tauri/target/release/bundle/nsis/*.exe and msi/*.msi

      - name: Inspect bundles
        shell: pwsh
        run: |
          Write-Host "=== Bundle directory ==="
          Get-ChildItem -Recurse src-tauri/target/release/bundle | Format-Table -AutoSize Name,Length,FullName
          Write-Host "=== NSIS ==="
          if (Test-Path src-tauri/target/release/bundle/nsis) { Get-ChildItem src-tauri/target/release/bundle/nsis | Format-List }
          Write-Host "=== MSI ==="
          if (Test-Path src-tauri/target/release/bundle/msi) { Get-ChildItem src-tauri/target/release/bundle/msi | Format-List }
          Write-Host "=== EXE ==="
          Get-ChildItem src-tauri/target/release/*.exe -ErrorAction SilentlyContinue | Format-List
          Write-Host "=== Checksums ==="
          if (Test-Path src-tauri/target/release/bundle/nsis) {
            Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { certutil -hashfile $_.FullName SHA256 }
          }
          if (Test-Path src-tauri/target/release/bundle/msi) {
            Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | ForEach-Object { certutil -hashfile $_.FullName SHA256 }
          }

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-installer
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: warn
